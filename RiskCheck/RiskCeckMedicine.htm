<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G6PD Drug Checker</title>

<style>
body {
  font-family: Arial;
  background:#f4f6fb;
  padding:40px;
  display:flex;
  justify-content:center;
}

.card {
  background:white;
  padding:30px;
  border-radius:16px;
  width:100%;
  max-width:600px;
  box-shadow:0 5px 25px rgba(0,0,0,.08);
}

textarea {
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

button {
  margin-top:15px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#4f46e5;
  color:white;
  font-weight:bold;
}

.result {
  margin-top:10px;
  padding:10px;
  border-radius:8px;
}

.high { background:#fee2e2; }
.low { background:#fef9c3; }
.unknown { background:#e2e8f0; }
</style>
</head>

<body>
<div class="card">

<h2>G6PD Drug Risk Checker</h2>

<textarea id="input" rows="4" placeholder="primaquine, paracetamol"></textarea>
<button onclick="check()">Check</button>

<div id="results"></div>

</div>

<script>
const HIGH = [
"primaquine","methylene blue","nitrofurantoin",
"sulfamethoxazole","acetylsalicylic acid","asa",
"ciprofloxacin","chloroquine"
];

const LOW = [
"paracetamol","acetaminophen","ascorbic acid",
"diphenhydramine"
];

function check(){
  const input = document.getElementById("input").value;
  const drugs = input.split(",").map(d => d.trim().toLowerCase()).filter(d=>d);
  const resultsDiv = document.getElementById("results");
  resultsDiv.innerHTML = "";

  drugs.forEach(d=>{
    let risk = "unknown";
    if(HIGH.includes(d)) risk="high";
    else if(LOW.includes(d)) risk="low";

    const div = document.createElement("div");
    div.className = "result " + risk;
    div.innerHTML = "<strong>"+d+"</strong> — "+risk.toUpperCase();
    resultsDiv.appendChild(div);
  });
}
</script>

</body>
</html>
