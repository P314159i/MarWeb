<!DOCTYPE html>
<html>
<head>
<title>Lipid Profile Clinical Assistant</title>

<style>

body{
font-family: Arial, Helvetica, sans-serif;
background:#0b3d2e;
margin:0;
padding:0;
display:flex;
justify-content:center;
}

.container{
width:700px;
margin-top:40px;
background:#f4f9f7;
padding:30px;
border-radius:10px;
box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

h2{
text-align:center;
color:#0b3d2e;
margin-bottom:25px;
}

label{
font-weight:bold;
color:#1e4d3a;
}

input,select{
width:100%;
padding:8px;
margin-top:5px;
margin-bottom:12px;
border-radius:6px;
border:1px solid #cdded8;
}

button{
width:100%;
padding:12px;
background:#2e8b57;
color:white;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#256f46;
}

#result{
margin-top:25px;
padding:20px;
background:#ffffff;
border-left:6px solid #2e8b57;
border-radius:6px;
}

.section{
margin-top:10px;
padding:10px;
background:#eef6f3;
border-radius:6px;
}

.warning{
background:#fff4e6;
border-left:5px solid #ff9800;
padding:10px;
border-radius:5px;
margin-top:10px;
}

.danger{
background:#ffeaea;
border-left:5px solid #d32f2f;
padding:10px;
border-radius:5px;
margin-top:10px;
}

.success{
background:#e8f5e9;
border-left:5px solid #2e7d32;
padding:10px;
border-radius:5px;
margin-top:10px;
}

</style>
</head>

<body>

<div class="container">

<h2>Lipid Profile Assistant</h2>

<label>Age</label>
<input type="number" id="age">

<label>Diabetes</label>
<select id="DM">
<option value="negative">Negative</option>
<option value="positive">Positive</option>
</select>

<label>LDL (mg/dL)</label>
<input type="number" id="LDL">

<label>Triglyceride (mg/dL)</label>
<input type="number" id="TG">

<label>ASCVD Risk %</label>
<input type="number" id="ASCVD">

<label>CVD Risk Factors</label>
<select id="RF">
<option value="0">0</option>
<option value="1">1</option>
<option value="2">More than 1</option>
</select>

<label>Established CVD</label>
<select id="CVD">
<option value="negative">Negative</option>
<option value="positive">Positive</option>
</select>

<label>CVD High Risk</label>
<select id="CVD_high">
<option value="negative">Negative</option>
<option value="positive">Positive</option>
</select>

<label>CVD Very High Risk</label>
<select id="CVD_very">
<option value="negative">Negative</option>
<option value="positive">Positive</option>
</select>

<button onclick="analyze()">Analyze Patient</button>

<div id="result"></div>

</div>

<script>

function analyze(){

let age = parseInt(document.getElementById("age").value);
let DM = document.getElementById("DM").value;
let LDL = parseFloat(document.getElementById("LDL").value);
let TG = parseFloat(document.getElementById("TG").value);
let ASCVD = parseFloat(document.getElementById("ASCVD").value);

let RF = parseInt(document.getElementById("RF").value);
let CVD = document.getElementById("CVD").value;
let CVD_high = document.getElementById("CVD_high").value;
let CVD_very = document.getElementById("CVD_very").value;

let statin_intensity="";
let LDL_cutoff="";
let output="";

if(DM=="negative" && RF==0 && CVD=="negative"){

if(LDL>=190){
statin_intensity="High";
LDL_cutoff=100;
}
else{

if(ASCVD<5){
statin_intensity="Very Very Low";
LDL_cutoff=190;
}
else if(ASCVD>=5 && ASCVD<7.5){
statin_intensity="Very Low";
LDL_cutoff=190;
}
else if(ASCVD>=7.5 && ASCVD<20){
statin_intensity="Moderate";
LDL_cutoff=100;
}
else{
statin_intensity="High";
LDL_cutoff=100;
}

}

}

if(DM=="positive" && RF==0 && age>40 && age<75){
statin_intensity="Moderate";
LDL_cutoff=100;
}

if(DM=="positive" && RF>=1 && age>40 && age<75){
statin_intensity="High";
LDL_cutoff=70;
}

if(DM=="positive" && CVD=="positive"){
statin_intensity="High";
LDL_cutoff=55;
}

if(DM=="negative" && CVD=="positive"){

if(CVD_high=="positive"){
statin_intensity="High";
LDL_cutoff=70;
}

if(CVD_very=="positive"){
statin_intensity="High";
LDL_cutoff=55;
}

}

output += "<div class='section'><b>Statin Intensity:</b> "+statin_intensity+"<br>";
output += "<b>LDL Cutoff:</b> "+LDL_cutoff+"</div>";

if(LDL>LDL_cutoff){

output += "<div class='danger'><b>LDL above cutoff</b><br>";

if(statin_intensity=="High"){
output += "Atorvastatin 80 mg OR Rosuvastatin 20 mg";
}

if(statin_intensity=="Moderate"){
output += "Atorvastatin 40 mg OR Rosuvastatin 10 mg";
}

if(statin_intensity=="Low"){
output += "Atorvastatin 10 mg OR Rosuvastatin 5 mg";
}

output += "</div>";

}
else{
output += "<div class='success'>LDL below cutoff. Statin therapy not required.</div>";
}

output += "<div class='section'><b>First Follow-up:</b> 1–3 months with LDL check</div>";

if(TG>500 && TG<1000){

output += "<div class='warning'><b>TG Management</b><br>";
output += "Lifestyle modification: weight loss, exercise, reduce carbohydrates, stop alcohol and smoking.";
output += "</div>";
}

if(TG>1000){

output += "<div class='danger'><b>Severe Hypertriglyceridemia</b><br>";
output += "Strict low-fat diet (<5%). Check TG every 3 days until <1000.";
output += "</div>";
}

document.getElementById("result").innerHTML=output;

}

</script>

</body>
</html>
